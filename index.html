<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本相图腾测试 - 探索你的灵魂动物</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4A853;
            --gold-light: #F5E6C8;
            --gold-dark: #8B6914;
            --deep-black: #0A0A0F;
            --mid-black: #151520;
            --card-bg: rgba(20, 20, 35, 0.85);
            --text-primary: #E8E0D0;
            --text-secondary: #A09888;
            --accent-red: #C0392B;
            --accent-green: #27AE60;
            --accent-blue: #2980B9;
            --accent-purple: #8E44AD;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--deep-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.8;
        }

        .stars-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .stars-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: float 8s infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(212, 168, 83, 0.3);
            margin-bottom: 10px;
            letter-spacing: 8px;
        }

        .header .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .header .divider {
            width: 120px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 20px auto;
        }

        .header .desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 2;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 168, 83, 0.15);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(212, 168, 83, 0.1), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .card-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.6rem;
            color: var(--gold);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title .icon { font-size: 1.8rem; }

        .card-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 30px;
            padding-left: 48px;
        }

        .progress-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 168, 83, 0.1);
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .progress-step .dot {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--mid-black);
            border: 2px solid rgba(212, 168, 83, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .progress-step.active .dot {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--deep-black);
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.4);
        }

        .progress-step.completed .dot {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }

        .progress-step .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .progress-step.active .label { color: var(--gold); }

        .progress-line {
            flex: 1;
            height: 2px;
            background: rgba(212, 168, 83, 0.2);
            margin: 0 10px;
            position: relative;
            top: -14px;
        }

        .progress-line.completed { background: var(--accent-green); }

        .form-group { margin-bottom: 24px; }

        .form-label {
            display: block;
            color: var(--gold-light);
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 168, 83, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 168, 83, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input::placeholder { color: rgba(160, 152, 136, 0.5); }

        .date-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .question-block {
            margin-bottom: 35px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border-left: 3px solid var(--gold);
            transition: all 0.3s;
        }

        .question-block:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-width: 5px;
        }

        .question-number {
            display: inline-block;
            background: var(--gold);
            color: var(--deep-black);
            width: 28px; height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-right: 10px;
        }

        .question-text {
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 18px;
            line-height: 1.7;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 168, 83, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0;
            background: var(--gold);
            transition: width 0.3s;
            opacity: 0.15;
        }

        .option:hover {
            border-color: rgba(212, 168, 83, 0.4);
            transform: translateX(5px);
        }

        .option:hover::before { width: 4px; }

        .option.selected {
            background: rgba(212, 168, 83, 0.1);
            border-color: var(--gold);
        }

        .option.selected::before {
            width: 4px;
            opacity: 0.3;
        }

        .option input[type="radio"] {
            appearance: none;
            width: 20px; height: 20px;
            border: 2px solid rgba(212, 168, 83, 0.4);
            border-radius: 50%;
            margin-right: 14px;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option input[type="radio"]:checked {
            border-color: var(--gold);
            background: var(--gold);
            box-shadow: 0 0 10px rgba(212, 168, 83, 0.4);
        }

        .option input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: var(--deep-black);
            border-radius: 50%;
        }

        .option-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .option.selected .option-text { color: var(--text-primary); }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--deep-black);
            box-shadow: 0 4px 20px rgba(212, 168, 83, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(212, 168, 83, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .btn-secondary:hover { background: rgba(212, 168, 83, 0.1); }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .result-container {
            display: none;
            text-align: center;
        }

        .result-totem {
            width: 200px; height: 200px;
            margin: 0 auto 30px;
            position: relative;
        }

        .totem-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 168, 83, 0.3) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        .totem-icon {
            font-size: 120px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 20px rgba(212, 168, 83, 0.5));
        }

        .result-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(212, 168, 83, 0.3);
        }

        .result-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .result-traits {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .trait-tag {
            padding: 8px 20px;
            background: rgba(212, 168, 83, 0.1);
            border: 1px solid rgba(212, 168, 83, 0.3);
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--gold-light);
        }

        .result-description {
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(212, 168, 83, 0.1);
        }

        .result-description h3 {
            color: var(--gold);
            font-family: 'Noto Serif SC', serif;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .result-description p {
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.9;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(212, 168, 83, 0.1);
        }

        .score-item .score-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .score-item .score-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .score-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold));
            border-radius: 3px;
            transition: width 1s ease-out;
        }

        .disclaimer {
            background: rgba(192, 57, 43, 0.1);
            border: 1px solid rgba(192, 57, 43, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .disclaimer-icon { font-size: 1.5rem; margin-bottom: 10px; }

        .disclaimer-text {
            color: #E74C3C;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .totems-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .totem-item {
            text-align: center;
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(212, 168, 83, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .totem-item:hover {
            background: rgba(212, 168, 83, 0.1);
            transform: translateY(-3px);
            border-color: rgba(212, 168, 83, 0.3);
        }

        .totem-item .emoji {
            font-size: 2rem;
            margin-bottom: 5px;
            display: block;
        }

        .totem-item .name {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.2rem; letter-spacing: 4px; }
            .card { padding: 25px 20px; }
            .date-inputs { grid-template-columns: 1fr; }
            .progress-step .label { display: none; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active { display: flex; }

        .loading-spinner {
            width: 60px; height: 60px;
            border: 3px solid rgba(212, 168, 83, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: var(--gold);
            font-size: 1.1rem;
            letter-spacing: 4px;
        }

        .zodiac-display {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(212, 168, 83, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(212, 168, 83, 0.3);
            margin-top: 15px;
        }

        .zodiac-display .zodiac-emoji { font-size: 1.5rem; }
        .zodiac-display .zodiac-text { color: var(--gold); font-weight: 600; }
    
        .intro-animation {
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
